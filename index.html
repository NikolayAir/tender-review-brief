<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the palette before the deferred app bundle runs.
      {
        let preference
        try {
          preference = window.localStorage.getItem('tender-brief-ui-color-theme')
        } catch {
          // Use the system preference if local storage is unavailable.
        }
        const systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const night = preference === 'night' || (preference !== 'day' && systemIsDark)
        document.documentElement.dataset.theme = night ? 'night' : 'day'
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tender Review Brief</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
